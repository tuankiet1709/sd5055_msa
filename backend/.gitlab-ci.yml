# GitLab CI/CD Pipeline for Backend
# Supports both AWS ECR and Azure ACR

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  
  # Application configuration
  APP_NAME: "sd5055-backend"
  
  # AWS Configuration
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "sd5055-backend"
  
  # Azure Configuration
  ACR_NAME: "sd5055practicaldevopsregistry"
  ACR_REPOSITORY: "sd5055-backend"

stages:
  - install
  - lint
  - test
  - build
  - push-aws
  - push-azure
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/node_modules/

install:dependencies:
  stage: install
  image: node:18-alpine
  script:
    - cd backend
    - npm ci
  artifacts:
    paths:
      - backend/node_modules/
    expire_in: 1 hour
  only:
    changes:
      - backend/**/*

lint:code:
  stage: lint
  image: node:18-alpine
  script:
    - cd backend
    - echo "Running linting checks..."
    # - npm run lint  # Uncomment when implemented
    - echo "Linting passed"
  only:
    changes:
      - backend/**/*
  needs: ["install:dependencies"]

test:unit:
  stage: test
  image: node:18-alpine
  script:
    - cd backend
    - echo "Running unit tests..."
    # - npm test  # Uncomment when implemented
    - echo "Tests passed"
  only:
    changes:
      - backend/**/*
  needs: ["install:dependencies"]

build:docker-image:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - cd backend
    - docker build -t $APP_NAME:${CI_PIPELINE_IID} .
    - echo "Docker image built successfully"
  only:
    changes:
      - backend/**/*
  needs: ["lint:code", "test:unit"]

push:aws-ecr:
  stage: push-aws
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip3 install --no-cache-dir awscli
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
  script:
    - cd backend
    - export IMAGE_TAG="${CI_PIPELINE_IID}"
    - export ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
    - export FULL_IMAGE_NAME="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    - export LATEST_IMAGE_NAME="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
    
    - docker build -t $FULL_IMAGE_NAME .
    - docker tag $FULL_IMAGE_NAME $LATEST_IMAGE_NAME
    
    - docker push $FULL_IMAGE_NAME
    - docker push $LATEST_IMAGE_NAME
    
    - echo "======================================"
    - echo "Image pushed to AWS ECR successfully!"
    - echo "  - $FULL_IMAGE_NAME"
    - echo "  - $LATEST_IMAGE_NAME"
    - echo "======================================"
  only:
    - main
    - develop
  needs: ["build:docker-image"]
  when: manual

