# Deploy to AWS EKS (optional - can be handled by ArgoCD)
deploy:aws-eks:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache python3 py3-pip curl
    - pip3 install --no-cache-dir awscli
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/
  script:
    - aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME
    - kubectl rollout restart deployment/frontend -n sd5055-msa
    - kubectl rollout status deployment/frontend -n sd5055-msa --timeout=300s
    - echo "Deployment to AWS EKS completed!"
  only:
    - main
  needs: ["push:aws-ecr"]
  when: manual

